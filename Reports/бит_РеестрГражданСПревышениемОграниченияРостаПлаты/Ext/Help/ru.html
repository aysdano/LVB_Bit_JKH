<h1 align="justify">Отчет "ПИ Отчет для г.Тюмень"</h1>
<p style="TEXT-ALIGN: justify; TEXT-INDENT: 17.85pt; MARGIN: 0cm 0cm 10pt" class="MsoNormal"><span style="LINE-HEIGHT: 115%; FONT-FAMILY: 'Times New Roman','serif'; FONT-SIZE: 12pt; mso-fareast-font-family: 'Times New Roman'; mso-fareast-language: RU"><o:p><span style="FONT-FAMILY: 'Times New Roman','serif'; FONT-SIZE: 10pt; mso-fareast-font-family: 'Times New Roman'; mso-fareast-language: RU; mso-ansi-language: RU; mso-bidi-language: AR-SA"><font size="3">Регламентированный отчет Тюменской области "Реестр граждан, у которых рост платежа за предоставленные услуги холодного и горячего водоснабжения, водоотведения, отопления превысил ограничения роста платы" при расчете сумм от Предельного индекса.</font></span></o:p></span></p></body></html>
