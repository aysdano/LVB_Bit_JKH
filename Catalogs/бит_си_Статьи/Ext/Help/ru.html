<h1>Справочник "Статьи справочной информации"</h1>
<p class="Usual">Справочник служит для создания, хранения и редактирования статей справочной информации, а также привязки статей к объектам конфигурации. </p>
<p class="Usual">Справочник является поставщиком данных для соответствующей обработки источника справочной информации.</p></body></html>
