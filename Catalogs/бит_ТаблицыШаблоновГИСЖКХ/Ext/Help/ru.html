<h1 align="justify">Справочник «Таблицы шаблонов ГИС ЖКХ»</h1>
<p style="TEXT-ALIGN: justify; MARGIN: 0cm 0cm 0pt" class="MsoNormal"><o:p></o:p></p>
<p style="TEXT-INDENT: -18pt; MARGIN: 0cm 0cm 0pt 18pt; tab-stops: list 18.0pt" class="MsoNormal"><b style="mso-bidi-font-weight: normal">1.</b><b style="mso-bidi-font-weight: normal"><span style="FONT-SIZE: 7pt"> </span>Назначение справочника</b></p>
<p style="TEXT-ALIGN: justify; MARGIN: 0cm 0cm 0pt" class="MsoNormal"><o:p></o:p></p>
<p style="TEXT-ALIGN: justify; MARGIN: 0cm 0cm 0pt 17.85pt" class="MsoNormal">Справочник <strong>«Таблица шаблонов ГИС ЖКХ»</strong> предназначен для создания в пользовательском режиме реквизитов для выгрузки в файлы ГИС ЖКХ, справочник технический, заполнение и изменение реквизитов выгрузки должен производить специалист 1С.</p>
